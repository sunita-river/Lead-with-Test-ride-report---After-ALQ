# Runs every morning on GitHub's servers - no PC needs to be on.
# GitHub can start scheduled runs late (sometimes hours) or drop them when busy, so there are
# several backup start times. The "check" job skips a run if today's report was already sent
# (data/last_sent.txt holds the IST date of the last real send), so the email goes out once a day.
# Repo secrets needed (Settings > Secrets and variables > Actions):
# SF_USERNAME, SF_PASSWORD, SF_SECURITY_TOKEN, SMTP_USER, SMTP_PASSWORD, EMAIL_TO
# Optional, recommended: SF_CONSUMER_KEY + SF_CONSUMER_SECRET from a Salesforce Connected App
# (client credentials flow). When set, they are used instead of the password + security token,
# so the run no longer breaks when the Salesforce password expires.
name: Daily Lead with Test Ride Report

on:
  schedule:
    - cron: "7 3 * * *"   # 08:37 IST - main run (off-peak minute so GitHub starts it sooner)
    - cron: "7 4 * * *"   # 09:37 IST - backup
    - cron: "7 6 * * *"   # 11:37 IST - backup
    - cron: "7 9 * * *"   # 14:37 IST - last backup
  workflow_dispatch: # "Run workflow" button for manual/test runs
    inputs:
      dry_run:
        description: "Dry run (build the CSV only - no email, no history update)"
        type: boolean
        default: true

permissions:
  contents: write # lets the job commit the updated data/lead_history.csv

concurrency:
  group: lead-report
  cancel-in-progress: false # never kill a report that is already sending; queue the next one

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # latest main, so it sees a send made by an earlier run today

      - id: guard
        name: Skip if today's report was already sent
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          last=$(cat data/last_sent.txt 2>/dev/null || echo none)
          echo "Today (IST): $today   Last sent: $last"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "Today's report was already sent - skipping this backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest -q # stop before emailing if anything is broken
      - run: python -m lead_report
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_CONSUMER_SECRET: ${{ secrets.SF_CONSUMER_SECRET }}
          SF_DOMAIN: rivermobilityprivatelimited2.my
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_PORT: "465"

      # Save the lead history so tomorrow's "new records" compares against this run,
      # and record today's date so the backup runs know the report was already sent.
      - name: Commit lead history
        if: env.DRY_RUN == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"

          TZ=Asia/Kolkata date +%F > data/last_sent.txt
          git add data/lead_history.csv data/last_sent.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update lead history $(TZ=Asia/Kolkata date +%F)"
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if ! git rebase --autostash origin/main; then
            echo "Rebase failed; aborting"
            git rebase --abort || true
            exit 1
          fi

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi
            echo "Push failed, retrying after rebase..."
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git rebase --autostash origin/main; then
              echo "Rebase failed; aborting"
              git rebase --abort || true
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lead-report
          path: output/
          retention-days: 30
