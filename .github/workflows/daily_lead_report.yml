# SCHEDULE: since 19-Nov-2026 the daily 08:30 IST run is on the EC2 Linux server (linux-server/crontab.txt ->
# cron.sh lead, backups 09:00 / 09:30). GitHub started its "08:37" runs at ~09:25, so the schedule was removed here.
# This workflow is kept only for a manual emergency run ("Run workflow") when the server is down. It commits the
# history to this repo; the server works from sunita-river/main, so copy data/ there afterwards.
# Repo secrets needed (Settings > Secrets and variables > Actions):
# SF_USERNAME, SF_PASSWORD, SF_SECURITY_TOKEN, SMTP_USER, SMTP_PASSWORD
# Recipients are listed in EMAIL_TO below (same as raam_lead_report.yml); the old EMAIL_TO secret is no longer used.
# Optional, recommended: SF_CONSUMER_KEY + SF_CONSUMER_SECRET from a Salesforce Connected App
# (client credentials flow). When set, they are used instead of the password + security token,
# so the run no longer breaks when the Salesforce password expires.
name: Daily Lead with Test Ride Report

on:
  # no schedule: the server sends at 08:30 IST (see the top of this file)
  workflow_dispatch: # "Run workflow" button for manual/test runs
    inputs:
      dry_run:
        description: "Dry run (build the CSV only - no email, no history update)"
        type: boolean
        default: false

permissions:
  contents: write # lets the job commit the updated data/lead_history.csv

concurrency:
  group: lead-report
  cancel-in-progress: false # never kill a report that is already sending; queue the next one

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # latest main, so it sees a send made by an earlier run today

      - id: guard
        name: Skip if today's report was already sent
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          last=$(cat data/last_sent.txt 2>/dev/null || echo none)
          echo "Today (IST): $today   Last sent: $last"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "Today's report was already sent - skipping this backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest -q # stop before emailing if anything is broken
      - run: python -m lead_report
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_CONSUMER_SECRET: ${{ secrets.SF_CONSUMER_SECRET }}
          SF_DOMAIN: rivermobilityprivatelimited2.my
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: sunita@rideriver.com,aarsh@rideriver.com,benwin@rideriver.com,akhil.sami@bmeg.in,biswajit.pradhan@bmeg.in,sriharsha.ch@bmeg.in,vartika.anand@bmeg.in,sunil.mujagond@bmeg.in,regil@rideriver.com,vinaysimha@rideriver.com,shashwat@rideriver.com
          SMTP_PORT: "465"

      # Save the lead history so tomorrow's "new records" compares against this run,
      # and record today's date so the backup runs know the report was already sent.
      - name: Commit lead history
        if: env.DRY_RUN == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"

          TZ=Asia/Kolkata date +%F > data/last_sent.txt
          git add data/lead_history.csv data/last_sent.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update lead history $(TZ=Asia/Kolkata date +%F)"
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if ! git rebase --autostash origin/main; then
            echo "Rebase failed; aborting"
            git rebase --abort || true
            exit 1
          fi

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi
            echo "Push failed, retrying after rebase..."
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git rebase --autostash origin/main; then
              echo "Rebase failed; aborting"
              git rebase --abort || true
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lead-report
          path: output/
          retention-days: 30
